name: snake

# Renders the contribution grid as a snake eating the squares. Reads the same
# public calendar as everything else, so it inherits whatever the privacy
# setting exposes. Output lands on the `output` branch rather than main, which
# keeps a daily binary churn out of the history people actually read.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2f81f7&color_dots=#161b22,#0e2f52,#1c5fa8,#2f81f7,#79c0ff
            dist/snake-light.svg?palette=github-light&color_snake=#1f6feb

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
