name: stats

# Rebuilds assets/stats.svg. The point of doing this ourselves rather than
# using a hosted card is the token: GITHUB_TOKEN cannot read the contribution
# calendar, and third-party cards use their own, so both only ever see public
# repositories. STATS_TOKEN is a PAT with read:user and nothing else.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::STATS_TOKEN is not set — see scripts/build-stats.py"
            exit 1
          fi
          python3 scripts/build-stats.py --login "${{ github.repository_owner }}"

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Refresh contribution stats"
          git push
