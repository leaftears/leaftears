name: stats

# Rebuilds assets/stats.svg from the contribution calendar. Uses the
# GITHUB_TOKEN that Actions hands out, so there is nothing to configure —
# but the calendar only includes private repositories if
# "Include private contributions on my profile" is on in account settings.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rasteriser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Render the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-stats.py --login "${{ github.repository_owner }}"

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats.png \
                  assets/languages.svg assets/languages.png
          git commit -m "Refresh profile cards"
          git push
